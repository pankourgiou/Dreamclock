<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alien Glyph Clock</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
  font-family: 'Orbitron', sans-serif;
}

/* VIDEO ZOOMED OUT */
#bgVideo {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;   /* 👈 shows full video */
  background: black;
  filter: brightness(0.7) saturate(1.2);
}

/* CLOCK */
#clock {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #00ffea;
  font-size: 5rem;
  letter-spacing: 0.4rem;
  text-shadow:
    0 0 10px #00ffea,
    0 0 25px #00ffee,
    0 0 50px #00ffaa;
  text-align: center;
}

#label {
  font-size: 1.2rem;
  opacity: 0.7;
  margin-top: 10px;
}
</style>
</head>

<body>

<video id="bgVideo" autoplay loop muted playsinline>
  <source src="Me_Robot_clock.mp4" type="video/mp4">
</video>

<div id="clock">☌☍☋</div>
<div id="label">XENOTIME</div>

<script>
// Alien symbols for digits 0–9
const alienDigits = {
  "0": "☉",
  "1": "☌",
  "2": "☍",
  "3": "3",
  "4": "⌬",
  "5": "⟁",
  "6": "⟡",
  "7": "⧗",
  "8": "⟁",
  "9": "⌖"
};

function toAlien(num) {
  return num.split("").map(d => alienDigits[d] || d).join("");
}

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,"0");
  const m = String(now.getMinutes()).padStart(2,"0");
  const s = String(now.getSeconds()).padStart(2,"0");

  const alienTime = `${toAlien(h)} : ${toAlien(m)} : ${toAlien(s)}`;
  document.getElementById("clock").textContent = alienTime;
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
